name: Release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (vX.Y.Z) on main
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-pypi
  cancel-in-progress: false

jobs:
  target:
    name: Verify release target
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.target.outputs.commit }}
      version: ${{ steps.target.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - id: target
        env:
          TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a release tag in vX.Y.Z format"
            exit 1
          fi
          commit=$(git rev-parse "refs/tags/$TAG^{commit}")
          git merge-base --is-ancestor "$commit" "$GITHUB_SHA"
          version=$(git show "$commit:pyproject.toml" |
            python -c 'import sys, tomllib; print(tomllib.loads(sys.stdin.read())["project"]["version"])')
          if [[ "$TAG" != "v$version" ]]; then
            echo "Tag $TAG does not match package version $version"
            exit 1
          fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  tests:
    needs: target
    uses: ./.github/workflows/tests.yml
    with:
      ref: ${{ needs.target.outputs.commit }}

  build:
    name: Build and validate distributions
    needs: [target, tests]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.target.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.target.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Build wheel and source distribution
        run: |
          python -m pip install build twine
          python -m build --outdir release/dist
          python -m twine check --strict release/dist/*
      - name: Verify clean installations
        shell: bash
        run: |
          for distribution in "$GITHUB_WORKSPACE"/release/dist/*; do
            temp=$(mktemp -d)
            python -m venv "$temp/venv"
            (
              cd "$temp"
              "$temp/venv/bin/python" -m pip install "$distribution"
              "$temp/venv/bin/python" -I "$GITHUB_WORKSPACE/.github/scripts/smoke-installed.py" "$VERSION"
              "$temp/venv/bin/python" -I -m unittest discover -s "$GITHUB_WORKSPACE/tests" -v
            )
          done
      - name: Prepare checksums and notes
        run: |
          (cd release/dist && sha256sum -- *.whl *.tar.gz) > release/SHA256SUMS
          awk -v heading="## $VERSION" '
            $0 == heading { found = 1; next }
            found && /^## / { exit }
            found && /[^[:space:]]/ { body = 1 }
            found { print }
            END { if (!body) exit 1 }
          ' CHANGELOG.md > release/notes.md
          printf '\n[PyPI release](https://pypi.org/project/sqlite-workqueue/%s/)\n' "$VERSION" >> release/notes.md
      - uses: actions/upload-artifact@v7
        with:
          name: release-files
          path: release/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: [target, build]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/sqlite-workqueue/${{ needs.target.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-files
      - name: Verify distribution checksums
        working-directory: dist
        run: sha256sum --check ../SHA256SUMS
      - name: Publish validated distributions
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  verify:
    name: Verify public PyPI installation
    needs: [target, publish]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.target.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.target.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v8
        with:
          name: release-files
          path: release
      - name: Compare public files with the validated artifacts
        shell: bash
        run: |
          curl --fail --silent --show-error --retry 6 --retry-all-errors --max-time 15 \
            "https://pypi.org/pypi/sqlite-workqueue/$VERSION/json" > "$RUNNER_TEMP/pypi.json"
          jq -er '.urls[] | "\(.digests.sha256)  \(.filename)"' "$RUNNER_TEMP/pypi.json" |
            sort > "$RUNNER_TEMP/pypi-sha256"
          diff -u <(sort release/SHA256SUMS) "$RUNNER_TEMP/pypi-sha256"
          curl --fail --silent --show-error --retry 6 --retry-all-errors --max-time 15 \
            "https://pypi.org/project/sqlite-workqueue/$VERSION/" > /dev/null
      - name: Install the exact version from PyPI
        run: |
          cd "$RUNNER_TEMP"
          printf 'sqlite-workqueue==%s' "$VERSION" > public-requirements.txt
          awk '{ printf " --hash=sha256:%s", $1 } END { print "" }' \
            "$GITHUB_WORKSPACE/release/SHA256SUMS" >> public-requirements.txt
          python -m venv public-install
          public-install/bin/python -m pip --isolated install --no-cache-dir \
            --index-url https://pypi.org/simple --require-hashes -r public-requirements.txt
          public-install/bin/python -I "$GITHUB_WORKSPACE/.github/scripts/smoke-installed.py" "$VERSION"

  github-release:
    name: Publish GitHub release
    needs: [target, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-files
      - name: Publish release and check its files
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          COMMIT: ${{ needs.target.outputs.commit }}
        shell: bash
        run: |
          (cd dist && sha256sum --check ../SHA256SUMS)
          test "$(gh api "repos/$GH_REPO/commits/$TAG" --jq .sha)" = "$COMMIT"
          gh release create "$TAG" dist/* SHA256SUMS --verify-tag --title "$TAG" --notes-file notes.md
          sha256sum SHA256SUMS > "$RUNNER_TEMP/expected-sha256"
          cat SHA256SUMS >> "$RUNNER_TEMP/expected-sha256"
          gh api "repos/$GH_REPO/releases/tags/$TAG" \
            --jq '.assets[] | "\(.digest | sub("^sha256:"; ""))  \(.name)"' |
            sort > "$RUNNER_TEMP/github-sha256"
          diff -u <(sort "$RUNNER_TEMP/expected-sha256") "$RUNNER_TEMP/github-sha256"
